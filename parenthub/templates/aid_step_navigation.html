{% from 'icons.html' import icon %}
{% macro steps() %}
<nav aria-label="Financial aid topics">
  <ul class="workspace-steps">
    {% for topic in guidance.topics %}
    <li><a href="{{ aid_link('learn', topic=topic.key) }}"{% if view == 'learn' and loop.index0 == topic_index %} aria-current="step"{% endif %}>
      <span class="step-index">{{ icon(topic.icon) }}</span><span>{{ topic.label }}</span>
    </a></li>
    {% endfor %}
    <li><a href="{{ aid_link('tools') }}"><span class="step-index">{{ icon('aid') }}</span><span>Useful Tools</span></a></li>
  </ul>
</nav>
{% endmacro %}
<aside class="workspace-sidebar panel" aria-label="Financial aid journey">
  <h2 class="section-header">Topics</h2>
  {{ steps() }}
</aside>
<details class="workspace-mobile panel">
  <summary>Topics</summary>
  {{ steps() }}
</details>
