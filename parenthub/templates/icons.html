{% macro icon(name, class_name='ui-icon') -%}
<svg class="{{ class_name }}" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  {% if name == 'help' %}<circle cx="12" cy="12" r="9"/><path d="M9.4 9a2.7 2.7 0 1 1 4.1 2.3c-1 .6-1.5 1.2-1.5 2.2m0 3h.01"/>
  {% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h1m3 0h1m3 0h1"/>
  {% elif name == 'aid' %}<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8m-8 3h5"/>
  {% elif name == 'guide' %}<path d="M12 6C9 4 6 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1v14"/>
  {% elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>
  {% elif name == 'check' %}<path d="m5 12 4 4 10-10"/>
  {% elif name == 'arrow' %}<path d="M4 12h15m-6-6 6 6-6 6"/>
  {% else %}<circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M9 18h5a4 4 0 0 0 0-8h-4a2 2 0 0 0 0 4h4"/>
  {% endif %}
</svg>
{%- endmacro %}
