{% extends 'base.html' %}
{% block content %}
<div class="form-layout">
<section class="panel" aria-label="Accept an invitation">
  <p>Link your demo applicant with the code issued to <strong>{{ current_user.email }}</strong>.</p>
  {% include 'invitation_form.html' %}
  <p class="form-companion"><a href="{{ url_for('main.help_center') }}">Get help</a></p>
</section>
{% if deadline %}{% include 'deadline_feature.html' %}{% else %}
<a href="{{ url_for('main.deadlines', _anchor='published-rounds') }}">Review dates by round</a>
{% endif %}
</div>
{% endblock %}
